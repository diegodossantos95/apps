name: Feature request
description: Suggest an idea or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Margin
        - Other (mention in description)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
